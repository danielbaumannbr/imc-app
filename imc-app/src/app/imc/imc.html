<div class="container">
  <h2>Calculadora de IMC</h2>

  <form [formGroup]="imcForm" (ngSubmit)="calcularIMC()">
    <label for="peso">Peso (kg):</label>
    <input id="peso" type="number" formControlName="peso" />

    <label for="altura">Altura (m):</label>
    <input id="altura" type="number" step="0.01" formControlName="altura" />

    <button type="submit" [disabled]="imcForm.invalid">Calcular</button>
  </form>

  <div *ngIf="imcResultado !== null" class="resultado">
    <h3>Seu IMC: {{ imcResultado }}</h3>
    <p>Classificação: <strong>{{ classificacao }}</strong></p>
  </div>
</div>
